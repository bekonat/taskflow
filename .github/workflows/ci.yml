name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Unit tests
        run: go test -race -cover ./...
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow?sslmode=disable
        run: go test -race -tags integration ./internal/repository/postgres/...
