services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://taskflow:taskflow@db:5432/taskflow?sslmode=disable"
      JWT_SECRET: "change-me-in-production-please"
      TOKEN_TTL: "24h"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
